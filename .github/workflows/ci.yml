name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 is the runtime `package.json` declares and the major the Vercel
          # deployment target can actually build. These three must agree, and
          # `tests/deployment-contract.test.ts` now checks that they do — a pin and a
          # workflow on different majors is a decorative pin, which is the defect this
          # value previously had.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      # `run-gate-batch.ps1` is the script that drives the gate batch, and until this step existed no
      # gate read it: ESLint returned exit 0 for it carrying "File ignored because no matching
      # configuration was supplied", and `prettier --check .` never asked, because Prettier has no parser
      # for `.ps1`. This parses it with PowerShell's own AST parser - no new dependency.
      #
      # **It reports rather than passes when no interpreter is found.** GitHub's `ubuntu-latest` images
      # ship `pwsh`, so this is expected to actually run here; if a future image drops it, the step
      # prints `ps:check NOT RUN` with the reason. That is a stated gap to resolve, not a pass -
      # `tests/gate-coverage.test.ts` records `.ps1` as covered BY THIS STEP, so deleting the step fails
      # the coverage guard instead of leaving the file silently unchecked.
      - name: PowerShell parse check
        run: npm run ps:check
      - name: Typecheck
        run: npm run typecheck
      # The build runs **before** the tests, which is the opposite of the order this workflow
      # shipped in, and the reason is not tidiness.
      #
      # `tests/motion-budget.test.ts` has two halves. Its manifest and import rules run
      # unconditionally; its **size** rules need a build report and skip without one. With the
      # tests first, those rules skipped in CI on every run and the job reported green for a file
      # whose headline is a budget. A named-list rule and a size rule were the only two
      # backstops against a renamed or forked animation package, so in CI only one of them was
      # actually running.
      #
      # M19 disclosed this in the test file's own header, which is honest but does not make the
      # check run. `tests/ci-workflow.test.ts` now asserts this ordering, so it cannot silently
      # regress to the shape that made the budget skip.
      #
      # The cost, stated rather than hidden: the build now runs before a failing test can stop the
      # job, so a red pull request spends a few minutes of CI on a build whose result nobody reads.
      # That is the correct trade - a budget that never runs is not a budget - but it is a real
      # cost and not a free fix.
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm test
